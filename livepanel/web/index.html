<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Live Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Cpolyline points='10,45 24,31 34,38 54,15' fill='none' stroke='%2334c759' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#fafafa;--fg:#1d1d1f;--mut:#6e6e73;--dim:#9a9aa2;--line:#e5e5ea;--card:#fff;--sub:#f4f4f6;--up:#0a8a3a;--dn:#d70015;
  --upb:rgba(10,138,58,.13);--dnb:rgba(215,0,21,.12);--acc:#0a63c9;--warn:#b25000}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--fg:#ececf0;--mut:#9a9aa2;--dim:#6b6b73;--line:#2a2b30;--card:#1a1b1f;--sub:#16171a;
  --up:#34c759;--dn:#ff453a;--upb:rgba(52,199,89,.18);--dnb:rgba(255,69,58,.18);--acc:#4a9dff;--warn:#ff9f0a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.live{color:var(--up);border-color:currentColor}.pill.err{color:var(--dn);border-color:currentColor}
.pill.dry{color:var(--warn);border-color:currentColor}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .k{font-size:12px;color:var(--mut)}.card .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.card .n{font-size:11px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.flat{color:var(--mut)}
.eq{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:11px;color:var(--dim);line-height:1.15;cursor:zoom-in;font-variant-numeric:tabular-nums}
.eq svg{flex:1;height:26px}.eq .r{text-align:right}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:500}
td.l,th.l{text-align:left}tr:last-child td{border-bottom:0}
tr.grp{cursor:pointer}tr.grp:hover td{background:var(--sub)}
tr.grp td.l{font-weight:600}
.car{display:inline-block;width:12px;font-style:normal;color:var(--dim);font-size:9px;transition:transform .15s}
tr.grp.open .car{transform:rotate(90deg)}
.chg{font-weight:400;font-size:12px;margin-left:5px}
tr.sub td{background:var(--sub);font-size:13px;padding:5px 10px}
tr.sub td.l{white-space:normal;overflow-wrap:anywhere}
tr.grp input[type=checkbox]{margin-right:4px}
tr.sub td.l{padding-left:24px}
tr.sub b{display:inline-block;min-width:26px;color:var(--mut);font-weight:600;font-size:12px;margin-right:5px}
.pc{display:inline-block;min-width:40px}.pc.hot{background:var(--dn);color:#fff;border-radius:4px;padding:0 4px;font-weight:600}
.ft{color:var(--mut);font-size:12px;margin:6px 2px 0}.ft b{color:var(--fg)}
.deals{margin-top:10px}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.danger{background:var(--dn);color:#fff;border-color:var(--dn)}button:disabled{opacity:.45;cursor:default}
#exitCmd{position:fixed;right:14px;bottom:12px;border-radius:99px;padding:6px 16px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.errs{color:var(--dn);font-size:13px;margin:6px 0}
.job{margin-top:14px}.job h3{font-size:14px;margin:0 0 6px}
small{color:var(--mut)}
input[type=checkbox]{margin:0 6px 0 0;vertical-align:-1px}
#ov{position:fixed;inset:0;background:var(--bg);padding:14px 16px;overflow-y:auto;z-index:20}
#ov .hd{display:flex;justify-content:space-between;align-items:center}
#ov .tabs span{cursor:pointer;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-right:6px}
#ov .tabs span.on{color:var(--fg);background:var(--card)}
#ovw{position:relative;margin-top:8px}#ovw svg{display:block;width:100%;height:190px}
#ovList{margin-top:10px;font-size:12px}#ovList td,#ovList th{padding:3px 6px}
#ovtip{position:absolute;pointer-events:none;display:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;white-space:nowrap}
/* dense layout: the small window (<=420 px) — one big number, two small lines, tight rows */
.dsum{margin:6px 0 4px;font-variant-numeric:tabular-nums}
.dsum .r1{display:flex;align-items:baseline;gap:6px}.dsum .r1 .k{font-size:11px;color:var(--mut)}
.dsum .r1 .v{font-size:21px;font-weight:700;letter-spacing:-.3px}.dsum .r1 .c{margin-left:auto;font-size:11px;color:var(--mut)}
.dsum .r2{display:flex;gap:10px;font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap}.dsum .r2 b{font-weight:600}
.dsum .r2 .tot{margin-left:auto}.dsum .r2 .tot b{color:var(--fg)}
@media (max-width:420px){body{font-size:12px}main{padding:6px 9px}header{gap:6px}h1{font-size:12.5px;color:var(--mut)}
  .pill{font-size:10.5px;padding:0 6px}#refresh{padding:1px 7px;font-size:11px;border-radius:6px}
  .eq{margin:2px 0 4px;font-size:9.5px;gap:5px}.eq svg{height:20px}
  .tbl{border-radius:6px}th{font-size:10px;padding:2px 5px}td{padding:3px 5px}tr.sub td{font-size:11px;padding:2px 5px}
  tr.sub td.l{padding-left:14px}tr.sub b{min-width:22px;font-size:10px}.chg{font-size:10.5px;margin-left:3px}.car{width:10px;font-size:8px}
  .pc{min-width:30px}.ft{font-size:10.5px;margin:3px 2px 0}.deals{margin-top:6px}
  #exitCmd{right:8px;bottom:6px;padding:2px 12px;font-size:12px}.errs{font-size:11px;margin:3px 0}
  .deals tr.grp td{font-size:11px;color:var(--mut)}}
/* settings page */
#set,#unl{position:fixed;inset:0;background:var(--bg);padding:14px 16px;overflow-y:auto;overflow-x:hidden;z-index:30}
#set small{overflow-wrap:anywhere}
#set .hd,#unl .hd{display:flex;justify-content:space-between;align-items:center}
.fs{margin:10px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.fs h4{margin:0 0 6px;font-size:13px}.sub2{margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>label:first-child:not(.ck){min-width:70px;color:var(--mut);font-size:12px}
label.ck{display:inline-flex;align-items:center;margin-right:10px;cursor:pointer}
#unl input[type=password],#set input[type=text],#set input[type=number],#set select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#set input.lbl{width:100px}#set input.port{width:84px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.res div{font-size:12px;margin:3px 0}.res .ok{color:var(--up)}.res .bad{color:var(--dn)}
@media (max-width:420px){#set{padding:8px 10px}.fs{padding:8px}.row>label:first-child:not(.ck){min-width:54px}#set input.lbl{width:84px}#set input.port{width:70px}#gear,#unlk{padding:1px 7px;font-size:11px;border-radius:6px}}
/* small app window (livepanel --window, ~460px) */
@media (max-width:560px){main{padding:10px}.sum{grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}.card{padding:8px 10px}
  .card .v{font-size:17px}th,td{padding:5px 6px}tr.sub td{padding:4px 6px}tr.sub td.l{padding-left:16px}h1{font-size:15px}#refresh{padding:4px 9px}}
</style>
</head>
<body>
<main>
  <header>
    <span id="status" class="pill">…</span>
    <span id="mode" class="pill" hidden></span>
    <span style="flex:1"></span>
    <button id="unlk" hidden>🔓</button>
    <button id="gear" hidden>⚙</button>
    <button id="refresh"></button>
  </header>
  <div id="errs" class="errs"></div>
  <section class="sum" id="sum"></section>
  <div class="eq" id="eq" hidden></div>
  <div class="bar" id="tradebar" hidden>
    <button id="exitSel" class="danger" disabled></button>
    <button id="exitAll"></button>
    <small id="tradeNote"></small>
  </div>
  <div class="tbl"><table id="pos"></table></div>
  <div class="ft" id="foot"></div>
  <div class="tbl deals" id="dealsBox" hidden><table id="deals"></table></div>
  <section id="jobs"></section>
</main>
<button id="exitCmd" class="danger" hidden></button>
<div id="ov" hidden>
  <div class="hd"><b id="ovTitle"></b><button id="ovX">✕</button></div>
  <div class="tabs" style="margin-top:8px"><span data-m="daily" class="on"></span><span data-m="intraday"></span></div>
  <div id="ovSum" class="ft"></div>
  <div id="ovw"><svg id="ovSvg"></svg><div id="ovtip"></div></div>
  <table id="ovList"></table>
</div>
<div id="unl" hidden>
  <div class="hd"><b id="unlTitle"></b><button id="unlX">✕</button></div>
  <div id="unlBody"></div>
</div>
<div id="set" hidden>
  <div class="hd"><b id="setTitle"></b><button id="setX">✕</button></div>
  <div id="setBody"></div>
</div>
<script>
const CFG = /*__CFG__*/{};
const T = {
 en:{refresh:"Refresh",equity:"Equity",today:"Today",week:"This week",month:"This month",live:"live",frozen:"closing marks · ",after:"after-hours pull · ",
   since:"since close",nodeposit:"excludes deposits (broker can't report them)",missing:"legs without broker P&L",
   notyet:"not enough history yet",loading:"loading deposits…",now:"now",
   head:["Symbol · stock today","Value","Today","P&L"],dte:"DTE",cost:"cost",stock:"stock",closedToday:"closed today",
   footMv:"Positions",expiry:"expiry",deals:"Recent fills",todayN:n=>`today ${n}`,buy:"Buy",sell:"Sell",
   shortTag:"seller",longTag:"buyer",soldAt:"sold at",close:{SELL:"sell to close",BUY:"buy back to close"},
   exitSel:"Exit selected",exitAll:"Exit all",exitCmd:"Exit",exitCmdOld:"Old exit tool · LIVE",stop:"Stop & cancel",dry:"DRY RUN — no orders are sent",real:"LIVE ORDERS",dryShort:"Rehearsal · no orders",modes:{dry:"rehearsal",real:"LIVE",paper:"paper",test:"test"},placed:n=>`placed ${n}`,
   confirm:(n,m,list)=>`Exit ${n} position(s)?\n\n${list}\n\nMode: ${m}\nLimit orders only: start at bid + 70% of spread (ask − 70% when buying back), one tick toward it every 10 s, never past it.`,
   allClosed:"✅ All closed — positions re-read after the job",someLeft:"⚠️ Still held after the job:",checkUnknown:"Couldn't re-read positions — check the broker",
   dryNote:"Rehearsal: real positions don't change",grpAll:"select every leg of this symbol",
   note:"Options trade 09:30–16:00 ET only.",job:"Exit job",side:"Side",qty:"Qty",price:"Price",bidask:"Bid / Ask",state:"State",filled:"Filled",inst:"Instrument",
   chart:"Equity (deposits included)",daily:"Daily",intra:"Today",sparkHint:"Click for the daily / today chart",
   colDate:"Date",colTime:"Time (every 30 min)",colEq:"Equity",colChg:"Change",depIn:"deposit",depOut:"withdrawal",
   legend:"▲ deposit ▼ withdrawal",
   calstale:"Holiday table ended — weekdays all look like trading days; update sessions.py",
   st:{queued:"queued",placed:"placed",stepping:"stepping down",at_passive:"at bid/ask, waiting",filled:"✅ filled",cancelled:"cancelled",
     rejected:"rejected",no_quote:"no quote — not placed",no_quote_hold:"quote gone — holding",no_qty:"nothing closable now — not placed",
     not_tradable:"market closed for this — not placed",rate_limited:"rate limit — next step",modify_failed:"modify failed — retrying",
     cancel_failed:"cancel failed — check the broker",cancelled_by_user:"cancelled (stop)",recheck_failed:"couldn't re-read positions — not placed"}},
 zh:{refresh:"刷新",equity:"总资产",today:"今日",week:"本周",month:"本月",live:"实时",frozen:"收盘价 · ",after:"盘后拉取 · ",
   since:"自收盘",nodeposit:"未扣出入金(券商不提供)",missing:"条券商没给今日盈亏",
   notyet:"记录还不够",loading:"正在拉出入金…",now:"现在",
   head:["标的 · 正股今天","市值","今日","持仓"],dte:"DTE",cost:"成本",stock:"正股",closedToday:"今天已平",
   footMv:"持仓市值",expiry:"到期",deals:"📜 最近买卖",todayN:n=>`今天 ${n} 笔`,buy:"买",sell:"卖",
   shortTag:"卖方",longTag:"买方",soldAt:"卖出价",close:{SELL:"卖出平仓",BUY:"买回平仓"},
   exitSel:"清选中",exitAll:"全部清仓",exitCmd:"清仓",exitCmdOld:"旧工具清仓 · 真单",stop:"停止并撤单",dry:"演练模式 —— 不会真的下单",real:"真实下单",dryShort:"演练 · 不下单",modes:{dry:"演练",real:"真单",paper:"模拟盘",test:"测试"},placed:n=>`已挂 ${n} 条`,
   confirm:(n,m,list)=>`清掉 ${n} 条腿？\n\n${list}\n\n模式：${m}\n只挂限价单：卖出平仓从买价 + 70% 价差开始、买回平仓从卖价 − 70% 价差开始，每 10 秒往对手价挪一格，永不越过。`,
   allClosed:"✅ 全部平掉 —— 清完已重新读持仓确认",someLeft:"⚠️ 清完还剩：",checkUnknown:"清完读不到持仓 —— 去券商确认",
   dryNote:"演练：真实持仓不会变",grpAll:"选这个标的的全部腿",
   note:"期权只能在美东 09:30–16:00 交易。",job:"清仓任务",side:"方向",qty:"数量",price:"价格",bidask:"买 / 卖",state:"状态",filled:"成交",inst:"标的",
   chart:"总资产走势(含出入金)",daily:"每日",intra:"今天",sparkHint:"点一下看每日 / 今天的走势",
   colDate:"日期",colTime:"时间(每 30 分)",colEq:"总资产",colChg:"变化",depIn:"入金",depOut:"出金",
   legend:"▲入金 ▼出金",
   calstale:"假日表已过期 —— 平日都会被当成交易日，请更新 sessions.py",
   st:{queued:"排队",placed:"已挂",stepping:"降价中",at_passive:"在买/卖价，等成交",filled:"✅ 全部成交",cancelled:"已撤",
     rejected:"被拒",no_quote:"没有报价，没挂",no_quote_hold:"报价消失，这一拍不动",no_qty:"现在没有可平的，没挂",
     not_tradable:"现在不是它的交易时段，没挂",rate_limited:"限频，下一拍再降",modify_failed:"改价失败，下一拍再试",
     cancel_failed:"撤单失败 —— 去券商确认",cancelled_by_user:"已撤（按了停止）",recheck_failed:"拉不到最新持仓，没挂"}}
};
const L = T[CFG.lang] || T.en;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v,d=2) => v==null||isNaN(v) ? "—" : Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = v => v==null ? "" : (v>0.5?"up":v<-0.5?"dn":"flat");
const pm = (v,d=2) => v==null ? "—" : (v>0?"+":"")+fmt(v,d);
const k1 = v => (v/1000).toFixed(1)+"k";
let sel = new Set(), last = null, OPEN = new Set(), ovMode = "daily";
const DENSE = matchMedia("(max-width:420px)");
DENSE.addEventListener("change", () => last && render(last));
try { OPEN = new Set(JSON.parse(localStorage.getItem("lp_open") || "[]")); } catch(e) {}

function card(k,v,cls,note){return `<div class="card"><div class="k">${k}</div><div class="v ${cls||""}">${v}</div>${note?`<div class="n">${note}</div>`:""}</div>`}

function render(s){
  if (s.ui_ver && CFG.ui_ver && s.ui_ver !== CFG.ui_ver) { location.reload(); return; }   // page upgraded on disk
  if (s.run_id && CFG.run_id && s.run_id !== CFG.run_id) { location.reload(); return; }   // server restarted (new token)
  last = s;
  const st = $("status");
  if (!s.ok && !s.positions){ st.className="pill err"; st.textContent = s.message||"…"; return; }
  st.className = "pill " + (s.frozen ? "" : "live");
  st.textContent = (s.frozen ? (s.pulled_live ? L.frozen : L.after) : L.live+" · ") + (s.as_of||"");
  const m = $("mode");
  if (CFG.trading){ m.hidden=false; m.className = "pill "+(CFG.dry_run?"dry":"err"); m.textContent = CFG.dry_run?(DENSE.matches?L.dryShort:L.dry):L.real; m.title = CFG.dry_run?L.dry:L.real; }
  const errs = Object.entries(s.errors||{}).map(([k,v])=>`${k}: ${v}`);
  (s.accounts||[]).filter(a=>!a.ok).forEach(a=>errs.push(`${a.account_id}: ${a.error||"?"}`));
  if (s.calendar_stale) errs.push(L.calstale);
  $("errs").innerHTML = errs.map(e=>`<div>${esc(e)}</div>`).join("");

  const p = s.periods||{};
  const per = x => x ? [pm(x.pnl), sgn(x.pnl), `${L.since} ${x.from.slice(5)}`+(x.flows_known?"":` · ${L.nodeposit}`)+(x.unconverted&&x.unconverted.length?` · ? ${esc(x.unconverted.join("/"))}`:"")] : ["…","",p.loading?L.loading:L.notyet];
  const w = per(p.week), mo = per(p.month);
  const short = a => String(a).split("-")[0];
  const accts = (s.accounts||[]).map(a=>`${esc(short(a.account_id))} ${fmt(a.equity,0)}`).join(" · ");
  const chips = Object.entries(s.acct_today||{}).map(([a,v])=>`${esc(short(a))} <span class="${sgn(v)}">${pm(v,0)}</span>`).join(" · ");
  const other = (s.other_ccy||[]).map(o=>`${esc(o.symbol)} ${pm(o.today)} ${esc(o.ccy)}`).join(" · ");
  if (DENSE.matches) {
    const tip = x => x ? ` title="${esc(x[2])}"` : "";
    const int = x => x ? [pm(x.pnl,0), x.pnl===undefined?"":sgn(x.pnl)] : ["…",""];
    const wi = p.week ? int(p.week) : [w[0], w[1]], mi = p.month ? int(p.month) : [mo[0], mo[1]];
    $("sum").className = "dsum";
    $("sum").innerHTML = `<div class="r1"><span class="k">${L.today}</span><span class="v ${sgn(s.today)}">${pm(s.today,0)}</span>`+
      `<span class="c">${s.today_missing ? `${s.today_missing} ${L.missing}` : chips}</span></div>`+
      `<div class="r2"><span${tip(w)}>${L.week} <b class="${wi[1]}">${wi[0]}</b></span><span${tip(mo)}>${L.month} <b class="${mi[1]}">${mi[0]}</b></span>`+
      `<span class="tot" title="${accts}">${L.equity} <b>${fmt(s.equity,0)}</b></span></div>`+
      ((accts || other) ? `<div class="r2">${accts}${other ? " · " + other : ""}</div>` : "");
  } else {
    $("sum").className = "sum";
    $("sum").innerHTML = card(L.equity, fmt(s.equity,0)+` <small>${esc(s.base||"")}</small>`, "", accts)
      + card(L.today, pm(s.today), sgn(s.today), s.today_missing ? `${s.today_missing} ${L.missing}` : [chips, other].filter(Boolean).join(" · "))
      + card(L.week, w[0], w[1], w[2]) + card(L.month, mo[0], mo[1], mo[2]);
  }
  drawSpark(s.spark||[]);
  drawGroups(s);
  drawDeals(s);
  syncBtns(); renderJobs(s.jobs||[]);
  if (!$("ov").hidden) drawOv();
}

function sparkSvg(d, W, H, stroke){
  const vs = d.map(x=>x[1]), lo = Math.min(...vs), hi = Math.max(...vs), sp = (hi-lo)||1;
  const pts = d.map((x,i)=>[i*W/(d.length-1), H-2-(x[1]-lo)/sp*(H-4)]);
  const line = pts.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const col = vs[vs.length-1] >= vs[0] ? "var(--up)" : "var(--dn)";
  return `<polyline points="0,${H} ${line} ${W},${H}" fill="${col}" fill-opacity=".12" stroke="none"/>`+
         `<polyline points="${line}" fill="none" stroke="${col}" stroke-width="${stroke}" vector-effect="non-scaling-stroke"/>`;
}
function drawSpark(d){
  const el = $("eq");
  if (d.length < 2){ el.hidden = true; return; }
  el.hidden = false;
  el.title = L.sparkHint;
  const up = d[d.length-1][1] >= d[0][1];

const EXPAND_ALL = new URLSearchParams(location.search).has("expand");   // ?expand: everything open (screenshots)
function drawGroups(s){
  const gs = s.groups||[];
  if (EXPAND_ALL) { gs.forEach(g=>OPEN.add(g.tk)); OPEN.add("_deals"); }
  const keys = new Set(gs.flatMap(g=>g.legs.map(l=>l.key))); sel.forEach(k=>{ if(!keys.has(k)) sel.delete(k) });
  let h = `<tr><th class="l">${L.head[0]}</th><th>${L.head[1]}</th><th>${L.head[2]}</th><th>${L.head[3]}</th></tr>`;
  for (const g of gs){
    const open = OPEN.has(g.tk);
    const chg = g.und_chg==null ? "" : `<span class="chg ${g.und_chg>0.005?"up":g.und_chg<-0.005?"dn":"flat"}">${(g.und_chg>0?"+":"")+g.und_chg.toFixed(1)}%</span>`;
    const col = g.today >= 0 ? "var(--upb)" : "var(--dnb)";
    const bar = `background:linear-gradient(to left,${col} ${Math.round(g.bar*100)}%,transparent ${Math.round(g.bar*100)}%)`;
    const pct = g.mixed ? pm(g.pl,0) : g.pct==null ? "—" : (g.pct>0?"+":"")+Math.round(g.pct)+"%";   // spread: dollars, not %
    const gk = g.legs.filter(l=>l.closable>0).map(l=>l.key), gsel = gk.filter(k=>sel.has(k)).length;
    const gcb = CFG.trading && gk.length ? `<input type="checkbox" data-g="${esc(g.tk)}" title="${L.grpAll}"${gsel===gk.length?" checked":""}>` : "";
    h += `<tr class="grp${open?" open":""}" data-tk="${esc(g.tk)}"><td class="l">${gcb}<i class="car">▶</i>${esc(g.tk)}${chg}</td>`+
         `<td>${g.legs.length ? fmt(g.mv,0) : "—"}</td><td style="${bar}" class="${sgn(g.today)}">${pm(g.today,0)}</td>`+
         `<td><span class="pc ${g.mixed?sgn(g.pl):g.pct==null?"flat":sgn(g.pl)}${g.hot?" hot":""}">${pct}</span></td></tr>`;
    if (!open) continue;
    for (const l of g.legs){
      const what = l.what === "stock" ? L.stock : esc(l.what);
      const dte = l.dte==null ? "" : ` · ${L.dte} ${l.dte}`;
      const gain = l.qty < 0 ? l.cost - l.px : l.px - l.cost;        // a short gains when the price falls
      const px = (l.cost!=null && l.px!=null) ? ` · ${l.qty < 0 ? L.soldAt : L.cost} ${fmt(l.cost,2)} → <span class="${gain>1e-9?"up":gain<-1e-9?"dn":"flat"}">${fmt(l.px,2)}</span>`+
        (l.pct!=null ? ` <span class="${sgn(l.pl)}">${l.pct>0?"+":""}${Math.round(l.pct)}%</span>` : "") : "";
      const cb = CFG.trading ? `<input type="checkbox" data-k="${esc(l.key)}" ${sel.has(l.key)?"checked":""}>` : "";
      const who = l.qty < 0 ? ` <span class="pill dry">${L.shortTag}</span>` : (l.what !== "stock" ? ` <small>${L.longTag}</small>` : "");
      h += `<tr class="sub"><td class="l" colspan="4">${cb}<b>${esc(l.acct)}</b>${what} ×${fmt(Math.abs(l.qty),0)}${who}${dte}${px}</td></tr>`;
    }
    for (const c of g.closed)
      h += `<tr class="sub"><td class="l" colspan="4"><b>${esc(String(c.account).split("-")[0])}</b>${c.what==="stock"?L.stock:esc(c.what)} ${L.closedToday} · <span class="${sgn(c.today)}">${pm(c.today,0)}</span></td></tr>`;
  }
  $("pos").innerHTML = h;
  document.querySelectorAll("#pos tr.grp").forEach(r=>r.onclick=()=>{
    const t = r.dataset.tk; OPEN.has(t) ? OPEN.delete(t) : OPEN.add(t);
    try { localStorage.setItem("lp_open", JSON.stringify([...OPEN])); } catch(e) {}
    render(last);
  });
  document.querySelectorAll("#pos input[data-k]").forEach(cb=>{ cb.onclick=e=>e.stopPropagation();
    cb.onchange=()=>{cb.checked?sel.add(cb.dataset.k):sel.delete(cb.dataset.k); render(last);}; });
  document.querySelectorAll("#pos input[data-g]").forEach(cb=>{ cb.onclick=e=>e.stopPropagation();
    cb.onchange=()=>{ const g = gs.find(x=>x.tk===cb.dataset.g); if(!g) return;
      g.legs.filter(l=>l.closable>0).forEach(l=>cb.checked?sel.add(l.key):sel.delete(l.key));
      if (cb.checked) OPEN.add(g.tk);                       // show what was just selected
      render(last); }; });
  document.querySelectorAll("#pos input[data-g]").forEach(cb=>{ const g = gs.find(x=>x.tk===cb.dataset.g);
    const ks = g ? g.legs.filter(l=>l.closable>0).map(l=>l.key) : [], n = ks.filter(k=>sel.has(k)).length;
    cb.indeterminate = n>0 && n<ks.length; });
  const f = s.foot||{};
  $("foot").innerHTML = gs.length ? `${L.footMv} <b>$${fmt(f.mv,0)}</b>` + (f.expiry ? ` · ${f.expiry.slice(5).replace("-","/")} ${L.expiry}` : "") : "";
}

function drawDeals(s){
  const d = s.fills||[];
  if (!d.length){ $("dealsBox").hidden = true; return; }
  $("dealsBox").hidden = false;

  if (open) for (const o of d)
    h += `<tr class="sub"><td class="l" colspan="4">${esc(o.time)} <b>${esc(o.acct)}</b><span class="${o.side==="BUY"?"up":"dn"}">${o.side==="BUY"?L.buy:L.sell}</span> ${esc(o.symbol)} ×${fmt(o.qty,0)} @${fmt(o.avg,2)}</td></tr>`;
  $("deals").innerHTML = h;

function drawOv(){
  const d = ovMode === "daily" ? (last.spark||[]) : (last.intraday||[]);
  const svg = $("ovSvg"), tip = $("ovtip");
  if (d.length < 2){ svg.innerHTML = ""; $("ovList").innerHTML = ""; $("ovSum").textContent = L.notyet; return; }
  const W = svg.clientWidth || 400, H = 190, vs = d.map(x=>x[1]), lo = Math.min(...vs), hi = Math.max(...vs), sp = (hi-lo)||1;
  const X = i => 4 + i*(W-8)/(d.length-1), Y = v => 14 + (hi-v)/sp*(H-28);
  const up = vs[vs.length-1] >= vs[0], col = up ? "var(--up)" : "var(--dn)";
  const pts = d.map((x,i)=>X(i).toFixed(1)+","+Y(x[1]).toFixed(1)).join(" ");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<polyline points="${X(0)},${H-14} ${pts} ${X(d.length-1)},${H-14}" fill="${col}" fill-opacity=".10" stroke="none"/>`+
    `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/>`+
    `<text x="${W-2}" y="10" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">${fmt(hi,0)}</text>`+
    `<text x="${W-2}" y="${H-2}" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">${fmt(lo,0)}</text>`+
    `<text x="2" y="${H-2}" font-size="10" fill="currentColor" opacity=".55">${esc(d[0][0])}</text>`+
    `<line id="ovx" x1="0" x2="0" y1="14" y2="${H-14}" stroke="currentColor" opacity=".35" stroke-dasharray="2,2" style="display:none"/>`;
  // deposits / withdrawals on the day they cleared: the curve includes them, so mark where money moved in or out
  const fund = {}; if (ovMode === "daily") (last.funding||[]).forEach(f => { fund[f[0]] = (fund[f[0]]||0) + f[1]; });
  d.forEach((x,i) => { const f = fund[x[0]]; if (!f) return;
    svg.innerHTML += `<text x="${X(i)}" y="${f>0 ? Y(x[1])-6 : Y(x[1])+13}" text-anchor="middle" font-size="11" fill="${f>0?"var(--acc)":"var(--warn)"}">${f>0?"▲":"▼"}</text>`; });
  const a = vs[0], b = vs[vs.length-1];
  $("ovSum").innerHTML = `${esc(d[0][0])} <b>${fmt(a,0)}</b> → ${L.now} <b>${fmt(b,0)}</b> · <span class="${b>=a?"up":"dn"}">${pm(b-a,0)} (${((b/a-1)*100).toFixed(1)}%)</span>`+
    (ovMode === "daily" && Object.keys(fund).length ? ` · <small>${L.legend}</small>` : "");
  // the list: newest first; today's view every 30 minutes
  const rows = d.map((x,i) => [x[0], x[1], i ? x[1]-d[i-1][1] : null]).reverse().filter((r,i) => ovMode === "daily" || i % 6 === 0);
  $("ovList").innerHTML = `<tr><th class="l">${ovMode==="daily"?L.colDate:L.colTime}</th><th>${L.colEq}</th><th>${L.colChg}</th></tr>` +
    rows.map(r => { const f = fund[r[0]];
      return `<tr><td class="l">${esc(ovMode==="daily"?r[0].slice(5):r[0])}${f?` <small class="${f>0?"":"dn"}">${f>0?"▲"+L.depIn:"▼"+L.depOut} ${fmt(Math.abs(f),0)}</small>`:""}</td>`+
             `<td>${fmt(r[1],0)}</td><td class="${r[2]==null?"":sgn(r[2])}">${r[2]==null?"":pm(r[2],0)}</td></tr>`; }).join("");
  svg.onmousemove = ev => { const r = svg.getBoundingClientRect(); let i = Math.round((ev.clientX-r.left-4)/((r.width-8)/(d.length-1)));
    i = Math.max(0, Math.min(d.length-1, i)); const x = X(i), ln = $("ovx"); ln.setAttribute("x1",x); ln.setAttribute("x2",x); ln.style.display="";
    const prev = i>0 ? d[i-1][1] : null;
    const fi = fund[d[i][0]];
    tip.innerHTML = `${esc(d[i][0])} · <b>${fmt(d[i][1],0)}</b>` + (prev==null ? "" : ` · <span class="${d[i][1]>=prev?"up":"dn"}">${pm(d[i][1]-prev,0)}</span>`) +
      (fi ? ` · ${fi>0?L.depIn:L.depOut} ${fmt(Math.abs(fi),0)}` : "");
    tip.style.display = "block"; tip.style.left = Math.max(0, Math.min(r.width-tip.offsetWidth, x*r.width/W - tip.offsetWidth/2))+"px"; tip.style.top = "0px"; };
  svg.onmouseleave = () => { tip.style.display = "none"; const ln = $("ovx"); if (ln) ln.style.display = "none"; };
}

function jobMsg(m){ return String(m).replace(/^placed (\d+)/, (_, n) => L.placed(n)); }   // the engine speaks English
function checkLine(j){
  if (!j.done || !j.closed_check) return "";
  if (j.closed_check === "dry") return `<div class="mut">${L.dryNote}</div>`;
  if (j.closed_check === "unknown") return `<div class="dn"><b>${L.checkUnknown}</b></div>`;
  if (j.closed_check === "all_closed") return `<div class="up"><b>${L.allClosed}</b></div>`;
  const left = j.legs.filter(l=>l.left>0).map(l=>`${esc(String(l.account).split("-")[0])} ${esc(l.name)} ×${fmt(l.left,0)}`).join(" · ");
  return `<div class="dn"><b>${L.someLeft}</b> ${left}</div>`;
}

  document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>post("/api/stop",{job:b.dataset.stop}));

function exitKeys(keys){

  const legs = (last&&last.groups||[]).flatMap(g=>g.legs.map(l=>({...l, tk:g.tk}))).filter(l=>keys.includes(l.key));
  const list = legs.map(l=>`${l.acct}  ${l.tk} ${l.what==="stock"?L.stock:l.what}  ${(L.close||{})[l.side]||l.side} ×${fmt(l.closable,0)}`).join("\n");
  if(!confirm(L.confirm(keys.length, CFG.dry_run?L.dry:L.real, list))) return;
  post("/api/exit",{keys}); sel.clear();
}

  h += `</div>`;
  const t = f.trading||{};
  h += `<div class="fs"><div class="row"><label>${SL.trade}</label><b class="${t.enabled&&!t.dry_run?"dn":""}">${!t.enabled?SL.tradeOff:t.dry_run?SL.tradeDry:SL.tradeLive}</b></div>`+
       `<small>${SL.tradeNote}</small><br><small>${SL.file}: ${esc(CFGPATH)}</small></div>`;
  h += `<div class="bar"><button id="sTest">${SL.test}</button><button id="sSave" class="pri">${SL.save}</button><button id="sLnk">${SL.lnk}</button></div><div id="sRes" class="res"></div>`;
  $("setBody").innerHTML = h;
  document.querySelectorAll("#setBody [data-b]").forEach(cb => cb.onchange = () => { collect(); const b = cb.dataset.b;
    FORM.brokers = cb.checked ? [...new Set([...FORM.brokers, b])] : FORM.brokers.filter(x=>x!==b); drawSettings(); });
  if ($("sAdd")) $("sAdd").onclick = () => { collect(); const ps = FORM.moomoo.logins.map(l=>+l.port||0);
    FORM.moomoo.logins.push({label:"", port:Math.max(11110, ...ps)+1}); drawSettings(); };
  document.querySelectorAll("#setBody [data-del]").forEach(b => b.onclick = () => { collect(); FORM.moomoo.logins.splice(+b.dataset.del,1); drawSettings(); });
  $("sTest").onclick = async () => { collect(); $("sRes").innerHTML = `<div class="mut">${SL.testing}</div>`;
    const [ok, j] = await api("/api/config/test", {form:FORM});
    $("sRes").innerHTML = ok ? j.rows.map(r=>`<div class="${r.code==="ok"?"ok":"bad"}">${r.code==="ok"?"✅":"❌"} ${esc(r.name)} — ${SL.code[r.code]||esc(r.code)}`+
      `${r.detail?` <small>${esc(r.detail)}</small>`:""}${(r.accounts||[]).length?` · ${SL.accounts}: ${r.accounts.map(esc).join(", ")}`:""}</div>`).join("")
      : `<div class="bad">${esc(j.error||"?")}</div>`; };
  $("sLnk").onclick = async () => { const [ok, j] = await api("/api/shortcut", {});
    $("sRes").innerHTML = ok ? `<div class="ok">${SL.lnkDone} ${esc(j.path)}</div>` : `<div class="bad">${esc(j.error||"?")}</div>`; };
  $("sSave").onclick = async () => { collect(); $("sRes").innerHTML = `<div class="mut">${SL.saving}</div>`;
    const [ok, j] = await api("/api/config", {form:FORM});
    if (!ok){ $("sRes").innerHTML = `<div class="bad">${esc(j.error||"?")}</div>`; return; }
    $("sRes").innerHTML = `<div class="ok">${SL.saved}</div><div class="mut">${SL.restarting}</div>`;
    const [ok2, j2] = await api("/api/restart", {});
    if (!ok2) $("sRes").innerHTML += `<div class="bad">${esc(j2.error||"?")}</div>`; };
}
$("setTitle").textContent = SL.title;
$("setX").onclick = () => { $("set").hidden = true; };
if (CFG.settings){ const g = $("gear"); g.hidden = false; g.title = SL.title; g.onclick = openSettings;
  if (CFG.first_run || new URLSearchParams(location.search).has("settings")) openSettings(); }   // ?settings: open it (screenshots)
// ── unlock trading (only when [trading] is on): one trade password per moomoo login, sent once, never kept ──
const U = {
 en:{title:"Unlock trading",note:"Live orders on moomoo need each login's trade password first. It goes only to that login's OpenD on this computer and is not saved. The GUI OpenD's own Unlock button works too.",
   dryWarn:"Rehearsal mode sends no orders, but this unlock is real: the login's OpenD stays unlocked until it restarts.",pw:"Trade password",go:"Unlock",done:"unlocked",none:"No login here needs unlocking (paper accounts don't).",bad:"failed",off:"OpenD not connected"},
 zh:{title:"解锁交易",note:"moomoo 真实下单前，每个号都要先用它自己的交易密码解锁。密码只交给这台电脑上那个号的 OpenD，不存档。图形版 OpenD 右上角的「解锁」按钮也可以用。",
   dryWarn:"演练模式不会下单，但这里的解锁是真的：这个号的 OpenD 会保持解锁，直到它重开。",pw:"交易密码",go:"解锁",done:"已解锁",none:"这里没有需要解锁的号（模拟账户不用解锁）。",bad:"失败",off:"OpenD 没连上"}
};
const UL = U[CFG.lang] || U.en;
function drawUnlock(){
  const s = last || {}, rows = (s.logins||[]).filter(l => l.unlock);
  if (!rows.length){ $("unlBody").innerHTML = `<p class="mut">${UL.none}</p>`; return; }
  $("unlBody").innerHTML = `<p class="mut" style="font-size:12px">${UL.note}</p>` + (CFG.dry_run ? `<p class="dn" style="font-size:12px">${UL.dryWarn}</p>` : "") + rows.map((l, i) => {
    const t = (s.unlocked||{})[l.name];
    return `<div class="fs"><div class="row"><b>${esc(l.label)}</b>${t ? ` <span class="up">✅ ${UL.done} ${esc(t)}</span>` : ""}`+
      `${l.connected ? "" : ` <span class="dn">${UL.off}</span>`}</div>`+
      `<div class="row"><input type="password" id="pw${i}" autocomplete="off" placeholder="${UL.pw}" maxlength="64">`+
      `<button data-u="${i}" class="pri">${UL.go}</button></div><div class="res" id="ur${i}"></div></div>`; }).join("");
  rows.forEach((l, i) => {
    const btn = document.querySelector(`#unlBody [data-u="${i}"]`), inp = $("pw" + i);
    btn.onclick = async () => {
      const pw = inp.value; inp.value = "";                       // cleared before it is even sent
      if (!pw) return;
      btn.disabled = true;
      const [ok, j] = await api("/api/unlock", {login: l.name, password: pw});
      btn.disabled = false;
      $("ur" + i).innerHTML = ok ? `<div class="ok">✅ ${UL.done}</div>` : `<div class="bad">${UL.bad}: ${esc(j.error||"?")}</div>`;
    };
    inp.onkeydown = e => { if (e.key === "Enter") btn.click(); };
  });
}
$("unlTitle").textContent = UL.title;
$("unlX").onclick = () => { $("unl").hidden = true; };
if (CFG.trading){ const u = $("unlk"); u.hidden = false; u.title = UL.title; u.onclick = () => { $("unl").hidden = false; drawUnlock(); }; }
poll(); setInterval(poll, 3000);
</script>
</body>
