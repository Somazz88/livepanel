# `livepanel --init` copies this to ~/.livepanel/config.toml. Edit that copy.

[brokers]
use = ["moomoo"]            # any of "moomoo", "ibkr", "demo" — several can share one panel

[moomoo]                    # needs OpenD running and logged in, and: pip install moomoo-api
host = "127.0.0.1"
port = 11111
paper = false               # true = the moomoo simulate account
include_futures = true      # add a universal account's futures sub-account to its equity
# Several moomoo logins: one OpenD per login, each on its own port. Settings a login leaves out come from above.
# [[moomoo.logins]]
# label = "Main"
# port = 11111
# [[moomoo.logins]]
# label = "Acct2"
# port = 11112

[ibkr]                      # needs TWS / IB Gateway running and logged in, and: pip install ib_async
host = "127.0.0.1"
port = 7496                 # TWS 7496 live / 7497 paper · Gateway 4001 live / 4002 paper
client_id = 17
market_data_type = 1        # 1 = live (needs a market-data subscription), 3 = delayed

[panel]
port = 8790
lang = "en"                 # "en" or "zh"
display_tz = "America/New_York"
refresh_sec = 20
lead_min = 30               # start refreshing this long before the 09:30 ET open
grace_min = 15              # keep refreshing this long after the close, then freeze on closing marks
base_currency = "USD"
data_dir = "~/.livepanel"   # equity history + exit logs live here, never in the repo
check_updates = true        # ask GitHub twice a day whether a newer release exists (one small request, nothing about you)

[fx]                        # units per 1 USD, for deposits made in another currency
# MYR = 4.20

[market]
extra_holidays = []         # e.g. ["2028-01-17"] once the built-in table runs out

[trading]
enabled = false             # the exit buttons only exist when true
dry_run = true              # true = real positions and quotes, simulated fills, nothing is sent
# start_frac = 0.70         # first order: bid + 70% of the spread when selling, ask - 70% when buying back
# step_sec = 10             # then one tick toward the bid (ask) every 10 s, never past it
allow_extended_hours = false  # stocks only; options never trade outside 09:30–16:00 ET
# exit_command = ["python", "my_exit_tool.py"]   # optional: a red "Exit" button that starts your own tool instead
# exit_window_prefix = "My Exit"                   # if that tool's window is already open, bring it back instead

[window]                    # `livepanel --window`: its own small window (Chrome / Edge app mode)
mode = "app"                # "app" or "tab" (a normal browser tab)
width = 320                 # first-open size; after that it reopens where and how big you left it (Windows)
height = 420
tray = true                 # Windows: icon by the clock — open the window, start with Windows, quit

[phone]                     # a read-only copy of the page for your phone (no exit, unlock or settings on it)
enabled = false
bind = "127.0.0.1"          # 127.0.0.1 with a tunnel (ngrok) on this computer, or this computer's Tailscale address
port = 8791
poll_sec = 60               # how often the phone page refreshes
# the link: `livepanel --phone-link` (it carries a key; delete ~/.livepanel/view_key to cancel every link)
